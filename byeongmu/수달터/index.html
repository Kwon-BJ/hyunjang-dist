<script>
  // 옛 휴대폰(iOS 16.4 아래 등)에서 게임이 못 열리면 「불러오는 중」에 멈춰 있지 않고 까닭을 보여 줌 — 부장님께 사진으로 받기 쉽게
  addEventListener('error', function (e) { var l = document.getElementById('load'); if (l) l.textContent = '수달터를 못 열었어요: ' + (e.message || '알 수 없음') + ' — 이 화면을 찍어 보내 주세요'; });
  setTimeout(function () { var l = document.getElementById('load'); if (l && l.textContent.indexOf('못 열') < 0) l.textContent = '아직 불러오는 중… 계속 이러면 이 화면을 찍어 보내 주세요 (' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 90) + ')'; }, 25000);

<div class="ui" id="win" hidden><div class="frame" id="frame"><div class="ribbon"><i class="ic" id="winIc"></i><span id="winTitle"></span></div><button type="button" id="winX" aria-label="닫기"></button><div id="winBody"></div><div id="winMsg"></div></div></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';

// ───────── 판 ─────────
const HQ = new URLSearchParams(location.search).has('hq');
const cv = document.getElementById('cv');
const touchy = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, touchy ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ea);
scene.fog = new THREE.Fog(0xcfe6ef, 55, 130);
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 400);
scene.add(new THREE.HemisphereLight(0xc4e4ff, 0x8a7a4a, 1.05));
const sun = new THREE.DirectionalLight(0xffe0b0, 2.9);
sun.castShadow = true;
sun.shadow.mapSize.set(touchy ? 1024 : 2048, touchy ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const U = { uTime: { value: 0 }, uCam: { value: new THREE.Vector3() }, uPlayer: { value: new THREE.Vector3() } }; // 셰이더 공통 값

// ───────── 섬 모양 (x 동쪽 · z 남쪽 · 높이 y) ─────────
const SEA_Y = -0.35;
const islandR = (a) => 62 + 3 * Math.sin(3 * a) + 2 * Math.sin(5 * a + 1);
const RW = 3; // 개울 반폭
const riverX = (z) => 24 + 4 * Math.sin(z * 0.06);
const BRIDGE = { x: 24, half: 5, w: 1.3, y: 0.3 };
const POND = { x: -28, z: 18, r: 6 };
const PLAZA = { x: 0, z: 0, r: 6 };
const PATHS = [[0, 0, 19, 0], [29, 0, 38, -10], [0, 0, -18, -15], [0, 0, 0, 44], [0, 0, -6, 30], [-6, 30, -20, 22]];
const FLAT = [{ x: 0, z: 0, r: 9 }, { x: -19, z: -17, r: 11 }, { x: 41, z: -10, r: 14 }, { x: 44, z: 14, r: 7 }, { x: 24, z: 0, r: 9 }]; // 언덕을 만들지 않는 곳
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const segDist = (px, pz, [ax, az, bx, bz]) => { const dx = bx - ax, dz = bz - az, t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz))); return Math.hypot(px - ax - t * dx, pz - az - t * dz); };
const pathDist = (x, z) => Math.min(Math.hypot(x - PLAZA.x, z - PLAZA.z) - PLAZA.r + 1.6, ...PATHS.map((s) => segDist(x, z, s)));
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
function noise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function height(x, z) {
  const d = Math.hypot(x, z), R = islandR(Math.atan2(z, x));
  const rv = Math.abs(x - riverX(z)), pd = Math.hypot(x - POND.x, z - POND.z);
  let h = -0.9 * sstep(R - 6, R + 3, d);
  let hill = sstep(R - 5, R - 15, d) * sstep(RW + 2, RW + 8, rv) * sstep(POND.r + 2, POND.r + 8, pd);
  for (const f of FLAT) hill *= sstep(f.r, f.r + 7, Math.hypot(x - f.x, z - f.z));
  const n = noise(x * 0.035 + 7, z * 0.035 + 3);
  h += hill * n * n * 2.6;
  h = Math.min(h, -0.8 * sstep(RW + 1.5, RW, rv));
  h = Math.min(h, -0.8 * sstep(POND.r + 1.5, POND.r, pd));
  return h;
}
// 집터: 문파원마다 하나씩(서버가 번호를 정해 줌) — 섬 안쪽 · 물 · 길 · 마을 시설을 피해 8칸 간격, 광장에 가까운 순 64개(2026-11-17 9칸 40개였는데 실제론 33개뿐 · 문파원 50명이라 늘림). 집터는 평평하게
const KEEP = [{ x: 0, z: 0, r: 10 }, { x: -19, z: -17, r: 10 }, { x: 41, z: -10, r: 13 }, { x: 44, z: 14, r: 7 }, { x: 0, z: 50, r: 6 }, { x: -4.5, z: -5, r: 4 }];
const PLOTS = (() => {
  const out = [];
  for (let gz = -56; gz <= 56; gz += 8) for (let gx = -56; gx <= 56; gx += 8) {
    const x = gx + (Math.abs(Math.round(gz / 8)) % 2 ? 4 : 0), z = gz;
    if (Math.hypot(x, z) > islandR(Math.atan2(z, x)) - 11) continue;
    if (Math.abs(x - riverX(z)) < RW + 5.5 || Math.hypot(x - POND.x, z - POND.z) < POND.r + 5.5 || pathDist(x, z) < 4.5) continue;
    if (KEEP.some((k) => Math.hypot(x - k.x, z - k.z) < k.r + 4)) continue;

    const b = (await (await fetch('build.txt?v=' + Date.now(), { cache: 'no-store' })).text()).trim().split(/\s+/)[0];
    if (/^\d{12}$/.test(b) && b !== GAME_BUILD && sessionStorage.getItem('sudalter-reloaded') !== b) { newGame = b; toast('새 판이 나왔어요 — 잠깐 멈추면 새로 열어요'); }
  } catch { /* 못 보면 지금 판으로 */ }
}
function newGameTick(dt) {
  if (!newGame) return;
  const idle = winEl.hidden && joy.id === null && !keys.size && me.speed < 0.05 && me.actT <= 0;
  idleT = idle ? idleT + dt : 0;
  if (idleT < 1.5) return;
  const b = newGame; newGame = '';
  try { sessionStorage.setItem('sudalter-reloaded', b); sessionStorage.setItem('sudalter-pos', JSON.stringify({ x: me.x, z: me.z, f: me.face, t: Date.now() })); } catch { /* */ }
  dirty = true; flush();
  const q = new URLSearchParams(location.search); q.set('v', b); location.replace(location.pathname + '?' + q);
}
setInterval(checkGame, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkGame(); });

// ───────── 시작 ─────────
const srcs = Object.fromEntries(await Promise.all([...new Set([...PROPS.map((p) => p[0]), '울타리', '보관함', '오두막', '나무집', '큰집', '도끼', '곡괭이'])].map(async (n) => [n, await loadModel(n)])));
for (const [n, x, z, r, h, b] of PROPS) placeModel(srcs[n], x, z, r, h, b);
for (const [x, z, r] of FENCES) placeModel(srcs['울타리'], x, z, r, 1.0, 'f');

// ───────── 미니맵 (북쪽 위 · 섬 전체) — 바탕(땅 · 물 · 길 · 나무 · 건물)은 한 번만 그리고, 상점 · 집 · 사람은 0.2초마다 ─────────
const MAP_R = 70, miniEl = $('mini'), mcv = $('miniCv'), mg = mcv.getContext('2d'), MS = mcv.width;
const mp = (x, z) => [(x + MAP_R) / (2 * MAP_R) * MS, (z + MAP_R) / (2 * MAP_R) * MS];
const mapBase = document.createElement('canvas'); mapBase.width = mapBase.height = MS;
{
  const g = mapBase.getContext('2d'), im = g.createImageData(MS, MS), d = im.data;
  for (let j = 0; j < MS; j++) for (let i = 0; i < MS; i++) {
    const x = (i + 0.5) / MS * 2 * MAP_R - MAP_R, z = (j + 0.5) / MS * 2 * MAP_R - MAP_R, h = height(x, z);
    let c;
    if (h < -0.18) c = h < -0.6 ? [72, 160, 204] : [116, 202, 216];
    else if (Math.hypot(x, z) > islandR(Math.atan2(z, x)) - 8) c = [240, 224, 172];
    else if (pathDist(x, z) < 1.6) c = [218, 186, 130];
    else { const k = Math.min(1, Math.max(0, h) / 2.5); c = [128 + 40 * k, 190 + 14 * k, 88 + 30 * k]; }
    d.set([c[0], c[1], c[2], 255], (j * MS + i) * 4);
  }
  g.putImageData(im, 0, 0);
  g.fillStyle = 'rgba(38, 104, 46, .6)'; for (const r of TREES) { const [x, z] = mp(r.x, r.z); g.beginPath(); g.arc(x, z, 2.4, 0, 7); g.fill(); }
  g.fillStyle = '#a84636'; for (const b of boxes) { const [x0, z0] = mp(b.x0, b.z0), [x1, z1] = mp(b.x1, b.z1); g.fillRect(x0, z0, Math.max(2, x1 - x0), Math.max(2, z1 - z0)); }
  g.fillStyle = '#9a6a3a'; { const [x0, z0] = mp(BRIDGE.x - BRIDGE.half, -1.5), [x1, z1] = mp(BRIDGE.x + BRIDGE.half, 1.5); g.fillRect(x0, z0, x1 - x0, z1 - z0); }
}
const imgOf = {}, iconImg = (id) => imgOf[id] || ((imgOf[id] = new Image()).src = `img/i-${id}.webp`, imgOf[id]);
let miniT = 0;
function mapLabel(text, x, y) { mg.font = '800 15px system-ui, sans-serif'; mg.textAlign = 'center'; mg.lineWidth = 4; mg.strokeStyle = 'rgba(255, 248, 230, .95)'; mg.strokeText(text, x, y); mg.fillStyle = '#4a2e14'; mg.fillText(text, x, y); }
function drawMini(dt) {
  if ((miniT -= dt) > 0) return; miniT = 0.2;
  const big = miniEl.classList.contains('big'), I = big ? 22 : 36; // 작을 땐 아이콘을 크게(화면에선 작아짐)
  mg.clearRect(0, 0, MS, MS); mg.drawImage(mapBase, 0, 0);
  for (const h of net.houses.values()) { const [x, z] = mp(PLOTS[h.plot].x, PLOTS[h.plot].z); mg.fillStyle = '#8a5a3a'; mg.fillRect(x - 4, z - 4, 8, 8); }
  const [sx, sz] = mp(SHOP_AT.x, SHOP_AT.z - 1.6), si = iconImg('조개'); if (si.complete) mg.drawImage(si, sx - I / 2, sz - I / 2, I, I);
  const [hx, hz] = mp(HOUSE_AT.x, HOUSE_AT.z), hi = iconImg(HOUSES[S.tier].model); if (hi.complete) mg.drawImage(hi, hx - I / 2, hz - I / 2, I, I);
  if (big) { mapLabel('상점', sx, sz + I / 2 + 15); mapLabel('내 집', hx, hz + I / 2 + 15); for (const h of net.houses.values()) { const [x, z] = mp(PLOTS[h.plot].x, PLOTS[h.plot].z); } }
  for (const o of net.others.values()) {
    const [x, z] = mp(o.x, o.z); mg.beginPath(); mg.arc(x, z, big ? 4 : 6, 0, 7); mg.fillStyle = '#' + lookOf(o.name).hood.toString(16).padStart(6, '0'); mg.fill(); mg.lineWidth = 2; mg.strokeStyle = '#fff'; mg.stroke();
    if (big) { mg.font = '700 11px system-ui, sans-serif'; mg.fillStyle = '#2a1a0a'; mg.textAlign = 'center'; mg.fillText(o.name, x, z - 7); }
  }
  const [mx, mz] = mp(me.x, me.z), k = big ? 0.8 : 1.4;
  mg.save(); mg.translate(mx, mz); mg.rotate(Math.PI - me.face); mg.scale(k, k);
  mg.beginPath(); mg.moveTo(0, -10); mg.lineTo(7, 7); mg.lineTo(0, 3); mg.lineTo(-7, 7); mg.closePath();
  mg.fillStyle = '#e8453c'; mg.fill(); mg.lineWidth = 2.5; mg.strokeStyle = '#fff'; mg.stroke(); mg.restore();
}
miniEl.addEventListener('click', () => { miniEl.classList.toggle('big'); miniT = 0; });

buildHouse(true);
try { // 새 판으로 새로 열린 거면 있던 자리로
  const p = JSON.parse(sessionStorage.getItem('sudalter-pos') || 'null'); sessionStorage.removeItem('sudalter-pos');
  if (p && Date.now() - p.t < 120000 && Number.isFinite(p.x)) { me.x = p.x; me.z = p.z; me.face = p.f; nudgeFree(); }
} catch { /* */ }
for (const t of TOOLS) { held[t] = heldModel(srcs[t]); me.obj.userData.hold.add(held[t]); }
connect();
npc = makeOtter({ fur: 0x7d5236, cream: 0xecd6b0, hood: 0x5a9a4a, pants: 0xb89a6a, dark: 0x1d1714 });
npc.position.set(-4.5, height(-4.5, -5.9), -5.9); scene.add(npc);
changed(); dirty = false;
document.getElementById('load').remove();
requestAnimationFrame((t) => { last = t; frame(t); });

// 시험용: sim(누를 키, 초) — 화면 속도와 상관없이 1/60초씩 움직여 본다
const sim = (codes, secs) => { codes.forEach((k) => keys.add(k)); for (let i = 0; i < Math.round(secs * 60); i++) step(1 / 60); codes.forEach((k) => keys.delete(k)); };
window.__수달터 = { me, free, height, circles, boxes, onBridge, BRIDGE, riverX, camera, renderer, quality, sim, joy, grass,
  S, TREES, ROCKS, BUSHES, FLOWERS, HOUSES, SHOP_AT, PLOTS, net, checkGame, save: () => { dirty = true; flush(); }, GAME_BUILD, doAction, findTarget, openWin, closeWin, count, flush,
  testHold, shakeFit, wobbleAngle, TRUNK, SHAKE_T, PAW_R, get newGame() { return newGame; }, get idleT() { return idleT; }, keys, get HOUSE_AT() { return HOUSE_AT; }, get CHEST_AT() { return CHEST_AT; }, get houseBox() { return houseBox; }, get clock() { return clock; } };

// ───────── 섬 모양 (x 동쪽 · z 남쪽 · 높이 y) ─────────
const SEA_Y = -0.35;

// ───────── 땅 ─────────
{

    c.copy(G1).lerp(G2, sstep(0.35, 0.75, n)).lerp(G3, 0.35 * sstep(0.6, 0.9, n2));
    const pd = pathDist(x, z);

  const tc = document.createElement('canvas'); tc.width = tc.height = 128; const tx = tc.getContext('2d');
  tx.fillStyle = '#fff'; tx.fillRect(0, 0, 128, 128);

  ground.receiveShadow = true; scene.add(ground);

// ───────── 막힘 ─────────
const circles = [], boxes = [];

}
const keepOut = [{ x: 0, z: 0, r: 10 }, { x: -19, z: -17, r: 10 }, { x: 41, z: -10, r: 13 }, { x: 44, z: 14, r: 7 }, { x: 0, z: 50, r: 6 }];

  const d = Math.hypot(x, z), R = islandR(Math.atan2(z, x));
  if (d > R - 10 || height(x, z) < 0 || pathDist(x, z) < gap) return false;
  if (Math.abs(x - riverX(z)) < RW + 2.5 || Math.hypot(x - POND.x, z - POND.z) < POND.r + 2.5) return false;
  return !keepOut.some((k) => Math.hypot(x - k.x, z - k.z) < k.r);

// ───────── 나무 · 바위 · 꽃 · 풀 (같은 모양은 한 번에 그림) ─────────
const paint = (g, hex) => { const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3); for (let i = 0; i < n; i++) a.set([c.r, c.g, c.b], i * 3); g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g; };

const strip = (g) => { if (g.index) g = g.toNonIndexed(); g.deleteAttribute('uv'); return g; }; // 공은 색인 없음 · 원기둥은 있음 → 모두 없앰
const TREE_KINDS = {
  round: mergeGeometries([
    part(new THREE.CylinderGeometry(0.17, 0.26, 1.5, 7), 0x8a5a36, 0, 0.75, 0),
    part(new THREE.IcosahedronGeometry(1.15, 2), 0x5fae45, 0, 2.15, 0, 1, 0.92, 1),
    part(new THREE.IcosahedronGeometry(0.75, 2), 0x6fbd4f, 0.55, 2.55, 0.3),
    part(new THREE.IcosahedronGeometry(0.7, 2), 0x56a03e, -0.5, 2.5, -0.25),
  ].map(strip)),
  fruit: mergeGeometries([
    part(new THREE.CylinderGeometry(0.17, 0.26, 1.4, 7), 0x8a5a36, 0, 0.7, 0),
    part(new THREE.IcosahedronGeometry(1.2, 2), 0x63b247, 0, 2.05, 0, 1, 0.9, 1),
    ...[[0.8, 2.0, 0.75], [-0.85, 2.1, 0.55], [0.2, 1.7, 1.08], [-0.3, 2.6, 0.9], [0.95, 2.5, -0.3], [-0.7, 1.75, -0.8]].map(([x, y, z]) => part(new THREE.IcosahedronGeometry(0.14, 1), 0xd8432f, x, y, z)),
  ].map(strip)),
  pine: mergeGeometries([
    part(new THREE.CylinderGeometry(0.14, 0.2, 1.0, 6), 0x7a4f30, 0, 0.5, 0),
    part(new THREE.ConeGeometry(1.15, 1.5, 8), 0x3f8a46, 0, 1.55, 0),
    part(new THREE.ConeGeometry(0.9, 1.3, 8), 0x479a4d, 0, 2.3, 0),
    part(new THREE.ConeGeometry(0.6, 1.1, 8), 0x51a655, 0, 3.0, 0),
  ].map(strip)),
};
const ROCK = paint(new THREE.DodecahedronGeometry(1, 0), 0xa4a49a);
const TUFT = mergeGeometries([0, 1, 2].map((i) => { const g = new THREE.ConeGeometry(0.05, 0.38, 3); g.rotateZ((i - 1) * 0.35); g.translate((i - 1) * 0.07, 0.17, 0); return strip(paint(g, 0x5d9e3a)); }));
const FLOWER = new THREE.IcosahedronGeometry(0.12, 0); FLOWER.translate(0, 0.14, 0);
const natMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });

    const r = place(x, z, k); if (!r) continue;

for (const [kind, n] of [['round', 95], ['pine', 40], ['fruit', 16]]) {
  scatter(TREE_KINDS[kind], natMat, n, 0, (x, z) => {
    if (!treeOk(x, z, 3.4)) return null;
    if (kind === 'pine' && Math.hypot(x, z) < 38) return null; // 소나무는 바깥쪽

// ───────── 다리 (나무 판) ─────────
{

  for (let i = 0; i < 17; i++) add(new THREE.BoxGeometry(0.52, 0.14, 3.1), i % 2 ? wood : dark, BRIDGE.x - BRIDGE.half + 0.3 + i * 0.59, BRIDGE.y - 0.07, 0);

// ───────── 모델 (CC0) ─────────
const PROPS = [
  // 이름, x, z, 돌림(도), 높이, 막힘
  ['텐트', -22, -20, 20, 1.7, 'c'], ['텐트', -15.5, -21.5, -15, 1.7, 'c'], ['모닥불', -19, -15.5, 0, 0.75, 'c'], ['침낭', -21.5, -13.5, 70, 0.22, ''],
  ['작업대', -13.5, -14.5, -90, 1.0, 'c'], ['모루', -12.8, -17.2, -60, 0.9, 'c'], ['보관함', -24.5, -15.5, 90, 0.75, 'c'], ['통', -25.5, -18, 0, 0.95, 'c'], ['상자', -26, -19.6, 25, 0.7, 'c'],

// ───────── 수달 (ChatGPT 수달 기본형을 보고 만듦: 갈색 털 · 크림 얼굴 · 파란 후드 · 베이지 바지) ─────────

  body.add(mesh(new THREE.BoxGeometry(0.012, 0.3, 0.02), M(0x3d5588), 0, 0.57, 0.19));
  for (const s of [-1, 1]) body.add(mesh(new THREE.BoxGeometry(0.1, 0.08, 0.02), M(0x45609a), s * 0.1, 0.45, 0.18));
  const arm = (s) => { const g = new THREE.Group(); g.position.set(s * 0.23, 0.7, 0); g.rotation.z = s * 0.18; g.add(mesh(CAP(0.075, 0.16), hood, 0, -0.12, 0), mesh(S(0.072), fur, 0, -0.27, 0.01)); body.add(g); return g; };
  const armL = arm(-1), armR = arm(1);
  const head = new THREE.Group(); head.position.set(0, 0.97, 0); body.add(head);
  head.add(mesh(S(0.26), fur, 0, 0, 0, 1, 0.94, 0.95));
  head.add(mesh(S(0.2), cream, 0, -0.07, 0.1, 1.05, 0.78, 0.8));
  head.add(mesh(S(0.1), cream, 0, -0.07, 0.21, 1.35, 0.8, 0.85));
  head.add(mesh(S(0.045), dark, 0, -0.025, 0.295, 1.35, 0.9, 0.8));
  for (const s of [-1, 1]) {
    head.add(mesh(S(0.036), dark, s * 0.095, 0.04, 0.22));
    head.add(mesh(S(0.012), white, s * 0.095 + 0.012, 0.056, 0.252));
    head.add(mesh(S(0.072), fur, s * 0.2, 0.15, -0.03, 1, 1, 0.7));
    head.add(mesh(S(0.042), cream, s * 0.2, 0.15, 0.015, 1, 1, 0.5));
    head.add(mesh(S(0.05), cream, s * 0.1, 0.11, 0.17, 1.3, 0.5, 0.6));
    const wg = new THREE.BufferGeometry().setFromPoints([0.08, 0, -0.06].flatMap((dy) => [new THREE.Vector3(s * 0.08, -0.06, 0.27), new THREE.Vector3(s * 0.3, -0.06 + dy * 0.8, 0.22)]));
    head.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0xf4efe6 })));
  }
  const tail = new THREE.Group(); tail.position.set(0, 0.3, -0.13); body.add(tail);
  let t = tail;
  for (const [r, l, rx] of [[0.085, 0.16, 0.8], [0.07, 0.15, 0.5], [0.05, 0.13, 0.25]]) { // + 가 뒤쪽 · 땅으로 휘어 눕게
    const seg = new THREE.Group(); seg.rotation.x = rx; t.add(seg);
    seg.add(mesh(CAP(r, l), fur, 0, -(l / 2 + r * 0.6), 0));
    const next = new THREE.Group(); next.position.y = -(l + r * 0.9); seg.add(next); t = next;
  }
  root.userData = { body, legL, legR, armL, armR, head, tail };
  return root;
}
function animOtter(o, phase, amt, run, t) {
  const p = o.userData, sw = Math.sin(phase);
  p.legL.rotation.x = sw * 0.75 * amt; p.legR.rotation.x = -sw * 0.75 * amt;
  p.armL.rotation.x = -sw * (run ? 0.9 : 0.55) * amt; p.armR.rotation.x = sw * (run ? 0.9 : 0.55) * amt;
  p.body.position.y = Math.abs(Math.cos(phase)) * (run ? 0.07 : 0.04) * amt + (1 - amt) * Math.sin(t * 2.2) * 0.008;
  p.body.rotation.x = (run ? 0.2 : 0.05) * amt;
  p.head.rotation.x = -(run ? 0.12 : 0.03) * amt + (1 - amt) * Math.sin(t * 1.1) * 0.03;
  p.head.rotation.z = (1 - amt) * Math.sin(t * 0.7) * 0.05;
  p.tail.rotation.y = Math.sin(phase * 0.5 + t * (1 - amt) * 1.5) * (0.25 + 0.15 * amt);
}

// ───────── 나 ─────────
const me = { x: 2, z: 5, face: 0, speed: 0, phase: 0, run: false, obj: makeOtter() };
scene.add(me.obj);
const WALK = 3.4, RUN = 6.4;

// ───────── 입력 ─────────
const keys = new Set();
addEventListener('keydown', (e) => { keys.add(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
const joy = { id: null, x0: 0, y0: 0, dx: 0, dy: 0 };
const JR = 60;
cv.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' || joy.id !== null || e.clientX > innerWidth * 0.55) return;
  joy.id = e.pointerId; joy.x0 = e.clientX; joy.y0 = e.clientY; joy.dx = joy.dy = 0;
  joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.style.display = 'block'; knob.style.transform = '';
  cv.setPointerCapture(e.pointerId); hideHint();
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.x0, dy = e.clientY - joy.y0; const l = Math.hypot(dx, dy); if (l > JR) { dx *= JR / l; dy *= JR / l; }
  joy.dx = dx / JR; joy.dy = dy / JR; knob.style.transform = `translate(${dx}px, ${dy}px)`;
});
const joyEnd = (e) => { if (e.pointerId !== joy.id) return; joy.id = null; joy.dx = joy.dy = 0; joyEl.style.display = 'none'; };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
const hintEl = document.getElementById('hint');
hintEl.textContent = touchy ? '왼쪽을 눌러 움직이기 · 끝까지 밀면 달리기' : 'WASD · 방향키 이동 · Shift 달리기';
let hintTimer = setTimeout(hideHint, 9000);
function hideHint() { clearTimeout(hintTimer); hintEl.classList.add('off'); }

// ───────── 카메라 ─────────
let camH = 11.5, camD = 11;
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  const portrait = h > w; camera.fov = portrait ? 50 : 36; camH = portrait ? 8 : 7; camD = portrait ? 9 : 8.6; // 롱빈터처럼 비스듬히(약 40도) · 세로 화면은 조금 멀리
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const camAt = new THREE.Vector3(me.x, 0, me.z);

// ───────── 돌리기 ─────────
let last = performance.now(), clock = 0;
function step(dt) {
  clock += dt;
  let mx = 0, mz = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) mz -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) mz += 1;
  let mag = Math.hypot(mx, mz), run = keys.has('ShiftLeft') || keys.has('ShiftRight');
  if (mag) { mx /= mag; mz /= mag; mag = 1; hideHint(); }
  else if (joy.id !== null) { const l = Math.hypot(joy.dx, joy.dy); if (l > 0.15) { mx = joy.dx / l; mz = joy.dy / l; mag = Math.min(1, l); run = l > 0.8; } }
  const target = mag ? (run ? RUN : WALK) * (run ? 1 : Math.max(0.45, mag)) : 0;
  me.speed += (target - me.speed) * Math.min(1, dt * 10);
  me.run = run && mag > 0;
  if (mag) {
    const want = Math.atan2(mx, mz); let d = want - me.face; d = Math.atan2(Math.sin(d), Math.cos(d)); me.face += d * Math.min(1, dt * 12);
    const vx = mx * me.speed * dt, vz = mz * me.speed * dt;
    if (free(me.x + vx, me.z + vz)) { me.x += vx; me.z += vz; }
    else if (free(me.x + vx, me.z)) me.x += vx;
    else if (free(me.x, me.z + vz)) me.z += vz;
  }
  me.phase += dt * me.speed * (me.run ? 2.2 : 2.9);
  const amt = Math.min(1, me.speed / WALK);
  me.obj.position.set(me.x, groundY(me.x, me.z), me.z); me.obj.rotation.y = me.face;
  animOtter(me.obj, me.phase, amt, me.run, clock);
  // 카메라 · 해
  const want = new THREE.Vector3(me.x, me.obj.position.y, me.z);
  if (camAt.distanceTo(want) > 8) camAt.copy(want); else camAt.lerp(want, Math.min(1, dt * 6)); // 멀리 옮겨지면(다시 태어남 등) 바로 따라붙음
  camera.position.set(camAt.x, camAt.y + camH, camAt.z + camD); camera.lookAt(camAt.x, camAt.y + 0.6, camAt.z);
  sun.position.set(camAt.x + 14, 26, camAt.z + 9); sun.target.position.copy(camAt);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); renderer.render(scene, camera); requestAnimationFrame(frame);
}

// ───────── 시작 ─────────
const srcs = Object.fromEntries(await Promise.all([...new Set([...PROPS.map((p) => p[0]), '울타리'])].map(async (n) => [n, await loadModel(n)])));
for (const [n, x, z, r, h, b] of PROPS) placeModel(srcs[n], x, z, r, h, b);
for (const [x, z, r] of FENCES) placeModel(srcs['울타리'], x, z, r, 1.0, 'f');
document.getElementById('load').remove();
requestAnimationFrame((t) => { last = t; frame(t); });

window.__수달터 = { me, free, height, circles, boxes, onBridge, BRIDGE, riverX, camera, renderer };
</script>

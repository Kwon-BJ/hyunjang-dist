     three.js(lib/) · 모델은 CC0(Kenney 생존 · Quaternius 농장, 기획/3D원본/출처.md) · 수달 · 나무 · 땅 · 물은 코드로 만듦

<script type="module">
import * as THREE from 'three';

// ───────── 판 ─────────
const HQ = new URLSearchParams(location.search).has('hq');
const cv = document.getElementById('cv');
const touchy = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, touchy ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ea);
scene.fog = new THREE.Fog(0xcfe6ef, 55, 130);
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 400);
scene.add(new THREE.HemisphereLight(0xc4e4ff, 0x8a7a4a, 1.05));
const sun = new THREE.DirectionalLight(0xffe0b0, 2.9);

sun.shadow.mapSize.set(touchy ? 1024 : 2048, touchy ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 90 });

const U = { uTime: { value: 0 }, uCam: { value: new THREE.Vector3() }, uPlayer: { value: new THREE.Vector3() } }; // 셰이더 공통 값

// ───────── 섬 모양 (x 동쪽 · z 남쪽 · 높이 y) ─────────
const SEA_Y = -0.35;
const islandR = (a) => 62 + 3 * Math.sin(3 * a) + 2 * Math.sin(5 * a + 1);
const RW = 3; // 개울 반폭
const riverX = (z) => 24 + 4 * Math.sin(z * 0.06);
const BRIDGE = { x: 24, half: 5, w: 1.3, y: 0.3 };
const POND = { x: -28, z: 18, r: 6 };
const PLAZA = { x: 0, z: 0, r: 6 };
const PATHS = [[0, 0, 19, 0], [29, 0, 38, -10], [0, 0, -18, -15], [0, 0, 0, 44], [0, 0, -6, 30], [-6, 30, -20, 22]];
const FLAT = [{ x: 0, z: 0, r: 9 }, { x: -19, z: -17, r: 11 }, { x: 41, z: -10, r: 14 }, { x: 44, z: 14, r: 7 }, { x: 24, z: 0, r: 9 }]; // 언덕을 만들지 않는 곳
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const segDist = (px, pz, [ax, az, bx, bz]) => { const dx = bx - ax, dz = bz - az, t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz))); return Math.hypot(px - ax - t * dx, pz - az - t * dz); };
const pathDist = (x, z) => Math.min(Math.hypot(x - PLAZA.x, z - PLAZA.z) - PLAZA.r + 1.6, ...PATHS.map((s) => segDist(x, z, s)));
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
function noise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function height(x, z) {
  const d = Math.hypot(x, z), R = islandR(Math.atan2(z, x));
  const rv = Math.abs(x - riverX(z)), pd = Math.hypot(x - POND.x, z - POND.z);
  let h = -0.9 * sstep(R - 6, R + 3, d);
  let hill = sstep(R - 5, R - 15, d) * sstep(RW + 2, RW + 8, rv) * sstep(POND.r + 2, POND.r + 8, pd);
  for (const f of FLAT) hill *= sstep(f.r, f.r + 7, Math.hypot(x - f.x, z - f.z));
  const n = noise(x * 0.035 + 7, z * 0.035 + 3);
  h += hill * n * n * 2.6;
  h = Math.min(h, -0.8 * sstep(RW + 1.5, RW, rv));
  h = Math.min(h, -0.8 * sstep(POND.r + 1.5, POND.r, pd));
  return h;
}
const onBridge = (x, z) => Math.abs(x - BRIDGE.x) < BRIDGE.half && Math.abs(z) < BRIDGE.w;
const groundY = (x, z) => (onBridge(x, z) ? Math.max(BRIDGE.y, height(x, z)) : height(x, z));
let seed = 20261117;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const isGrass = (x, z) => {
  const d = Math.hypot(x, z), R = islandR(Math.atan2(z, x));
  return d < R - 8.5 && height(x, z) > -0.05 && pathDist(x, z) > 1.7 && Math.abs(x - riverX(z)) > RW + 1.9 && Math.hypot(x - POND.x, z - POND.z) > POND.r + 1.9;
};

// ───────── 땅 ─────────
{
  const C = (h) => new THREE.Color(h);
  const G1 = C(0x86c04f), G2 = C(0xa8d264), G3 = C(0x6aa944), DIRT = C(0xdcbc8a), DIRT2 = C(0xc9a06c), SAND = C(0xf0e0b0), WET = C(0xc2b083), BANK = C(0xdccb9a);
  const geo = new THREE.PlaneGeometry(150, 150, 300, 300); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = height(x, z);
    pos.setY(i, h);
    const n = noise(x * 0.12, z * 0.12), n2 = noise(x * 0.5 + 40, z * 0.5);
    c.copy(G1).lerp(G2, sstep(0.35, 0.75, n)).lerp(G3, 0.35 * sstep(0.6, 0.9, n2));
    c.lerp(C(0xb7d86c), sstep(0.4, 1.6, h) * 0.35); // 언덕 위는 밝게
    const pd = pathDist(x, z);
    c.lerp(DIRT.clone().lerp(DIRT2, n2 * 0.6), sstep(1.9, 1.2, pd));
    const d = Math.hypot(x, z), R = islandR(Math.atan2(z, x));
    c.lerp(SAND, sstep(R - 9.5, R - 7, d));
    const bank = Math.max(sstep(RW + 1.9, RW + 0.7, Math.abs(x - riverX(z))), sstep(POND.r + 1.9, POND.r + 0.7, Math.hypot(x - POND.x, z - POND.z)));
    c.lerp(BANK, bank * 0.85);
    c.lerp(WET, sstep(-0.15, -0.4, h));
    col.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const tc = document.createElement('canvas'); tc.width = tc.height = 128; const tx = tc.getContext('2d');
  tx.fillStyle = '#fff'; tx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 700; i++) { const g = 215 + Math.floor(rnd() * 40); tx.fillStyle = `rgb(${g},${g},${g})`; tx.fillRect(rnd() * 128, rnd() * 128, 1 + rnd() * 2, 1 + rnd() * 2); }
  const tex = new THREE.CanvasTexture(tc); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(90, 90); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;

}

// ───────── 물 (얕은 곳 청록 · 깊은 곳 파랑 · 물가 거품 · 반짝임) ─────────
{
  const N = 256, data = new Uint8Array(N * N * 4);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = -75 + (i + 0.5) * 150 / N, z = -75 + (j + 0.5) * 150 / N;
    data[(j * N + i) * 4] = Math.round(255 * Math.min(1, Math.max(0, (SEA_Y - height(x, z)) / 1.2)));
    data[(j * N + i) * 4 + 3] = 255;
  }
  const depthTex = new THREE.DataTexture(data, N, N); depthTex.magFilter = depthTex.minFilter = THREE.LinearFilter; depthTex.needsUpdate = true;
  const mat = new THREE.ShaderMaterial({
    transparent: true, fog: true, depthWrite: false,
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uShallow: { value: new THREE.Color(0x5fd6d0) }, uDeep: { value: new THREE.Color(0x2f8fc4) } }]),
    vertexShader: `
      varying vec2 vXZ;
      #include <fog_pars_vertex>
      void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vXZ = wp.xz; vec4 mvPosition = viewMatrix * wp; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform float uTime; uniform sampler2D uDepth; uniform vec3 uShallow, uDeep; varying vec2 vXZ;
      #include <fog_pars_fragment>
      void main() {
        vec2 uv = (vXZ + 75.0) / 150.0;
        float d = (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) ? 1.2 : texture2D(uDepth, uv).r * 1.2;
        vec3 col = mix(uShallow, uDeep, smoothstep(0.05, 0.9, d));
        float w = sin(vXZ.x * 2.1 + uTime * 1.3) * sin(vXZ.y * 1.8 - uTime * 1.1) + 0.6 * sin((vXZ.x + vXZ.y) * 3.7 + uTime * 2.1);
        col += vec3(0.9, 0.95, 1.0) * smoothstep(1.25, 1.5, w) * 0.22;
        float f = smoothstep(0.075, 0.015, d + 0.02 * sin(uTime * 1.6 + vXZ.x * 1.3 + vXZ.y * 1.1));
        col = mix(col, vec3(1.0), f * 0.6);
        gl_FragColor = vec4(col, max(mix(0.5, 0.93, smoothstep(0.0, 0.6, d)), f * 0.7));
        #include <fog_fragment>
      }`,
  });
  mat.uniforms.uTime = U.uTime; mat.uniforms.uDepth = { value: depthTex };
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), mat);
  sea.rotation.x = -Math.PI / 2; sea.position.y = SEA_Y; scene.add(sea);
}

// ───────── 막힘 ─────────
const circles = [], boxes = [];
function free(x, z, r = 0.32) {
  if (!onBridge(x, z) && height(x, z) < -0.18) return false;
  for (const c of circles) if ((x - c.x) ** 2 + (z - c.z) ** 2 < (c.r + r) ** 2) return false;
  for (const b of boxes) if (x > b.x0 - r && x < b.x1 + r && z > b.z0 - r && z < b.z1 + r) return false;
  return true;
}
const keepOut = [{ x: 0, z: 0, r: 10 }, { x: -19, z: -17, r: 10 }, { x: 41, z: -10, r: 13 }, { x: 44, z: 14, r: 7 }, { x: 0, z: 50, r: 6 }];
const clearSpot = (x, z, gap) => {
  const d = Math.hypot(x, z), R = islandR(Math.atan2(z, x));
  if (d > R - 10 || height(x, z) < 0 || pathDist(x, z) < gap) return false;
  if (Math.abs(x - riverX(z)) < RW + 2.5 || Math.hypot(x - POND.x, z - POND.z) < POND.r + 2.5) return false;
  return !keepOut.some((k) => Math.hypot(x - k.x, z - k.z) < k.r);
};

// ───────── 모양 만들기 도구 ─────────
const toFlat = (g) => { if (g.index) g = g.toNonIndexed(); if (g.attributes.uv) g.deleteAttribute('uv'); return g; };
// 높이에 따라 c0 → c1 로 물들임(아래 어둡게 · 위 밝게 — 그림 같은 느낌)
function grad(g, c0, c1, y0, y1, jitter = 0) {
  g = toFlat(g); const p = g.attributes.position, a = new Float32Array(p.count * 3), A = new THREE.Color(c0), B = new THREE.Color(c1), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) { c.copy(A).lerp(B, sstep(y0, y1, p.getY(i))); if (jitter) c.multiplyScalar(1 - jitter + 2 * jitter * hash(p.getX(i) * 7.1, p.getZ(i) * 3.3 + p.getY(i))); a.set([c.r, c.g, c.b], i * 3); }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g;
}
const at = (g, x, y, z, sx = 1, sy = sx, sz = sx) => { g.scale(sx, sy, sz); g.translate(x, y, z); return g; };
// 잎 덩어리: 공 여러 개를 모아 둥근 나무 모양
function canopy(cy, R, n, dark, light, s) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + hash(i, s) * 0.8, rr = i === 0 ? 0 : R * (0.45 + 0.25 * hash(s, i)), yy = i === 0 ? 0.15 : (hash(i * 3, s) - 0.35) * R * 0.9;
    out.push(at(new THREE.IcosahedronGeometry(R * (i === 0 ? 0.85 : 0.5 + 0.18 * hash(i, s * 2)), 1), Math.cos(a) * rr, cy + yy, Math.sin(a) * rr));
  }

}
// 바람 · 가림(수달과 카메라 사이면 비침)
function windy(mat, { sway = 0.05, from = 1.0, occlude = false, noFlip = false } = {}) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    if (noFlip) sh.fragmentShader = sh.fragmentShader.replace('#include <normal_fragment_begin>', THREE.ShaderChunk.normal_fragment_begin.replace('gl_FrontFacing ? 1.0 : - 1.0', '1.0')); // 풀잎 뒷면도 앞면처럼 밝게
    sh.vertexShader = 'uniform float uTime;\nvarying vec3 vWPos;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec2 ip = instanceMatrix[3].xz;
      #else
        vec2 ip = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xz;
      #endif
      float k = max(0.0, position.y - ${from.toFixed(2)});
      transformed.x += (sin(uTime * 1.7 + ip.x * 0.31 + ip.y * 0.23) + 0.4 * sin(uTime * 3.3 + ip.x)) * ${sway.toFixed(3)} * k * k;
      transformed.z += sin(uTime * 1.3 + ip.y * 0.41) * ${(sway * 0.6).toFixed(3)} * k * k;`).replace('#include <project_vertex>', `#include <project_vertex>
      vec4 wq = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        wq = instanceMatrix * wq;
      #endif
      vWPos = (modelMatrix * wq).xyz;`);

      vec3 pa = uCam, pb = uPlayer + vec3(0.0, 0.6, 0.0), ab = pb - pa;
      float tt = clamp(dot(vWPos - pa, ab) / dot(ab, ab), 0.0, 1.0);
      if (tt < 0.94 && length(vWPos - (pa + ab * tt)) < 1.9 && mod(floor(gl_FragCoord.x) + 2.0 * floor(gl_FragCoord.y), 4.0) > 0.5) discard;`);

// ───────── 나무 · 덤불 · 바위 · 꽃 · 풀 (같은 모양은 한 번에 그림) ─────────
const BARK0 = 0x5e3b22, BARK1 = 0x9a6a40;

const TREE_KINDS = {
  round: mergeGeometries([trunk(1.6, 0.27, 0.17), ...canopy(2.4, 1.25, 7, 0x2f7a33, 0x9ad65a, 1)]),
  round2: mergeGeometries([trunk(1.9, 0.3, 0.18), ...canopy(2.8, 1.45, 8, 0x2a6e30, 0x8fcf55, 2)]),
  fruit: mergeGeometries([trunk(1.4, 0.26, 0.16), ...canopy(2.15, 1.2, 7, 0x3a8a37, 0xa6dc62, 3),
    ...[[0.8, 2.0, 0.85], [-0.85, 2.15, 0.65], [0.2, 1.65, 1.1], [-0.3, 2.7, 0.95], [0.95, 2.55, -0.3], [-0.75, 1.75, -0.85], [0.4, 2.9, 0.4]].map(([x, y, z]) => grad(at(new THREE.IcosahedronGeometry(0.15, 1), x, y, z), 0xb52a1c, 0xff6a4a, y - 0.15, y + 0.15))]),
  pine: mergeGeometries([trunk(1.0, 0.22, 0.14), ...[[1.25, 1.6, 1.45], [1.0, 1.4, 2.25], [0.7, 1.2, 2.95], [0.42, 0.9, 3.55]].map(([r, h, y]) => grad(at(new THREE.ConeGeometry(r, h, 8), 0, y, 0), 0x1f5a35, 0x5fa85a, y - h / 2, y + h / 2, 0.05))]),
  bush: mergeGeometries([...canopy(0.5, 0.6, 5, 0x2f7a33, 0x8fcf55, 4),
    ...[[0.35, 0.75, 0.35], [-0.3, 0.8, 0.3], [0.05, 0.95, -0.2], [0.45, 0.55, -0.25]].map(([x, y, z]) => grad(at(new THREE.IcosahedronGeometry(0.07, 0), x, y, z), 0xffffff, 0xffffff, 0, 1))]),
};
const ROCK = (() => { const g = toFlat(new THREE.DodecahedronGeometry(1, 1)); const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = 0.85 + 0.3 * hash(Math.round(x * 9), Math.round(z * 9) + Math.round(y * 9)); p.setXYZ(i, x * k, y * k, z * k); } g.computeVertexNormals(); return grad(g, 0x7e8078, 0xb8b6a8, -0.6, 0.6); })();
const mossy = (g) => { const p = g.attributes.position, c = g.attributes.color, m = new THREE.Color(0x7aa848), t = new THREE.Color(); for (let i = 0; i < p.count; i++) if (p.getY(i) > 0.55) { t.setRGB(c.getX(i), c.getY(i), c.getZ(i)).lerp(m, 0.6); c.setXYZ(i, t.r, t.g, t.b); } return g; };
mossy(ROCK);
const BLADE = (() => { // 풀잎 하나: 아래 진한 초록 → 끝 연두
  const w = 0.05, h = 0.3, g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-w, 0, 0, w, 0, 0, -w * 0.7, h * 0.4, 0, w * 0.7, h * 0.4, 0, -w * 0.35, h * 0.75, 0, w * 0.35, h * 0.75, 0, 0, h, 0.02]), 3));

    else if (free(me.x + vx, me.z)) me.x += vx;
    else if (free(me.x, me.z + vz)) me.z += vz;
  }
  me.phase += dt * me.speed * (me.run ? 2.2 : 2.9);
  const amt = Math.min(1, me.speed / WALK);
  me.obj.position.set(me.x, groundY(me.x, me.z), me.z); me.obj.rotation.y = me.face;
  animOtter(me.obj, me.phase, amt, me.run, clock);
  const want = new THREE.Vector3(me.x, me.obj.position.y, me.z);
  if (camAt.distanceTo(want) > 8) camAt.copy(want); else camAt.lerp(want, Math.min(1, dt * 6)); // 멀리 옮겨지면(다시 태어남 등) 바로 따라붙음
  camera.position.set(camAt.x, camAt.y + camH, camAt.z + camD); camera.lookAt(camAt.x, camAt.y + 0.6, camAt.z);
  sun.position.set(camAt.x + 16, 24, camAt.z + 10); sun.target.position.copy(camAt);
  U.uTime.value = clock; U.uCam.value.copy(camera.position); U.uPlayer.value.copy(me.obj.position);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt);
  if (quality.level === 0) renderer.render(scene, camera); else composer.render();
  if (!HQ && quality.level > 0 && clock > 1.5) { // 처음 1.5초 뒤부터 3초씩 재서 느리면 낮춤
    fpsT += dt; fpsN++;
    if (fpsT > 3) { quality.fps = fpsN / fpsT; if (quality.fps < 26) setQuality(quality.level - 1); fpsT = fpsN = 0; }
  }
  requestAnimationFrame(frame);
}

// ───────── 시작 ─────────
const srcs = Object.fromEntries(await Promise.all([...new Set([...PROPS.map((p) => p[0]), '울타리'])].map(async (n) => [n, await loadModel(n)])));
for (const [n, x, z, r, h, b] of PROPS) placeModel(srcs[n], x, z, r, h, b);
for (const [x, z, r] of FENCES) placeModel(srcs['울타리'], x, z, r, 1.0, 'f');
document.getElementById('load').remove();
requestAnimationFrame((t) => { last = t; frame(t); });

// 시험용: sim(누를 키, 초) — 화면 속도와 상관없이 1/60초씩 움직여 본다
const sim = (codes, secs) => { codes.forEach((k) => keys.add(k)); for (let i = 0; i < Math.round(secs * 60); i++) step(1 / 60); codes.forEach((k) => keys.delete(k)); };
window.__수달터 = { me, free, height, circles, boxes, onBridge, BRIDGE, riverX, camera, renderer, quality, sim, joy, grass };

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0708">
<title>봉인검록 — 베타</title>
<!-- 봉인검록(가칭) 클로즈 베타 (2026-10-27). 병무청 문파원 40명이 먼저 해 보고, 반응이 좋으면 구글 플레이 앱으로.
     로그인(병무청 홈페이지) → 캐릭터 만들기 → 캐릭터 화면 → 마을(NPC · 파티 · 거래 · 채팅) → 던전. 서버는 ../서버(클라우드플레어) -->
<style>
  html, body { margin: 0; height: 100%; background: #0c0708; color: #f3e6c8; font-family: "Noto Sans KR", system-ui, sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); container-type: size; }
  canvas#cv { display: block; width: 100%; height: 100%; }
  .btn { font: inherit; font-size: 15px; font-weight: 700; padding: 9px 20px; border-radius: 999px; border: 1px solid #f6d27a; background: #8a2a1c; color: #fff4dc; cursor: pointer; }
  .btn.ghost { background: transparent; color: #f6d27a; }
  .btn.danger { border-color: #e5484d; color: #ff9a8a; }
  .btn.tiny { font-size: 12px; padding: 4px 10px; }
  .btn.tiny.on { background: #2e6b3a; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  #panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,4,6,.6); z-index: 5; }
  #panel[hidden] { display: none; }
  #panelIn { max-width: 520px; width: 88%; max-height: 90%; overflow: auto; padding: 18px 22px; border: 1px solid #b8893a; border-radius: 14px; background: linear-gradient(#1e1214, #120a0c); text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6); scrollbar-width: thin; }
  #panelIn.wide { max-width: 860px; }
  #panelIn h1 { margin: 0 0 4px; font-size: 32px; letter-spacing: 4px; color: #f6d27a; }
  #panelIn h2 { margin: 0 0 6px; font-size: 20px; color: #f6d27a; }
  #panelIn p { margin: 6px 0; font-size: 14px; line-height: 1.55; }
  .sub { color: #c9b48a; font-size: 12.5px !important; }
  .story { font-size: 15px !important; min-height: 3em; }
  .grade { font-size: 60px; font-weight: 900; color: #f6d27a; line-height: 1; }
  .reward { color: #9df59a; font-weight: 700; }
  .create { display: flex; gap: 18px; align-items: flex-start; text-align: left; }
  .cleft { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 0 0 auto; }
  .cright, .cinfo { flex: 1; min-width: 0; }
  .parts { display: grid; gap: 4px; }
  .prow { display: grid; grid-template-columns: 74px 30px 1fr 34px 30px; align-items: center; gap: 4px; font-size: 13px; }
  .prow .btn.tiny { padding: 2px 0; width: 30px; }
  .pval { display: flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #000; display: inline-block; }
  .jobs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #6b5a3a; background: #1a1012; color: #c9b48a; }
  .chip.on { border-color: #f6d27a; color: #fff4dc; background: #5a2a1c; }
  .chip:disabled { opacity: .55; }
  .equip { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin: 6px 0; }
  .bag { display: grid; gap: 4px; margin: 6px 0; text-align: left; }
  .item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border: 1px solid #3a2a22; border-radius: 8px; background: rgba(255,255,255,.03); font-size: 13px; }
  .item > span { flex: 1; }
  .item small { color: #c9b48a; }
  .trade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
  .tcol input { width: 90px; font: inherit; background: #120a0c; color: #fff; border: 1px solid #6b5a3a; border-radius: 6px; padding: 3px 6px; margin: 4px 6px 4px 0; }
  .keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 14px; text-align: left; }
  .krow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; border-bottom: 1px solid #2a1c18; }
  .kbtn { font: inherit; font-size: 13px; font-weight: 700; min-width: 86px; padding: 4px 10px; border-radius: 6px; border: 1px solid #b8893a; background: #241612; color: #f6d27a; cursor: pointer; }
  .kbtn.wait { background: #8a2a1c; color: #fff; }
  #hud { position: absolute; top: 8px; right: 10px; display: flex; gap: 6px; align-items: center; z-index: 3; }
  #hud[hidden] { display: none; }
  #hud .who { font-size: 13px; font-weight: 700; color: #ffe08a; text-shadow: 0 1px 2px #000; margin-right: 6px; }
  #partyBox { position: absolute; top: 10px; left: 10px; z-index: 3; padding: 6px 10px; border-radius: 8px; background: rgba(10,6,8,.7); border: 1px solid #3a6b8a; font-size: 12px; display: grid; gap: 2px; }
  #partyBox[hidden] { display: none; }
  #chat { position: absolute; left: 10px; bottom: 10px; width: 36%; z-index: 3; font-size: 12px; pointer-events: none; }
  #chatLog div { text-shadow: 0 1px 2px #000; }
  #chatLog b { color: #ffe08a; }
  #chatIn { pointer-events: auto; width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px; border: 1px solid #6b5a3a; background: rgba(10,6,8,.7); color: #fff; }
  #asks { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 6; display: grid; gap: 6px; }
  .ask { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 10px; background: #241612; border: 1px solid #f6d27a; font-size: 14px; }
  .toast { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); z-index: 7; padding: 8px 16px; border-radius: 999px; background: rgba(20,12,10,.92); border: 1px solid #b8893a; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; } .toast.bad { border-color: #e5484d; color: #ffb0a6; } .toast.good { border-color: #3ccf6a; color: #b4ffbf; }
  .pad { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .pad[hidden] { display: none; }
  .tb { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(246,210,122,.7); background: rgba(40,16,14,.55); color: #fff4dc; font: 700 13px "Noto Sans KR", sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; touch-action: none; }
  .tb.on { background: rgba(160,60,30,.75); }
  /* 가방 — 오른쪽에서 열리는 창(부장님이 보내 준 그림처럼): 종류별 칸 · 등급 색 · 강화 · 개수 · 끼는 중(E) */
  #bagSide { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 46%); z-index: 4; display: flex; flex-direction: column; background: rgba(28,30,40,.97); border-left: 1px solid #4a4f66; box-shadow: -8px 0 30px rgba(0,0,0,.5); font-size: 13px; }
  #bagSide[hidden] { display: none; }
  .bs-top { display: flex; align-items: stretch; border-bottom: 1px solid #3a3f55; }
  .bs-tab { flex: 1; padding: 8px 0 6px; text-align: center; color: #8a90a8; font-weight: 700; border: 0; background: none; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
  .bs-tab.on { color: #fff; border-bottom-color: #f6d27a; }
  .bs-x { width: 42px; border: 0; background: none; color: #fff; font-size: 22px; cursor: pointer; }
  .bs-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  .bs-cnt { flex: 1; padding: 4px 10px; border-radius: 999px; background: #151722; color: #dfe3f2; font-weight: 700; }
  .bs-bar select { font: inherit; padding: 4px 6px; border-radius: 8px; background: #151722; color: #dfe3f2; border: 1px solid #3a3f55; }
  .bs-body { flex: 1; display: flex; min-height: 0; }
  .bs-list { flex: 1; overflow-y: auto; padding: 0 6px 8px 10px; scrollbar-width: thin; }
  .bs-rail { width: 44px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 8px; border-left: 1px solid #2c3042; }
  .bs-rail button { border: 0; background: none; color: #8a90a8; font: 700 11px "Noto Sans KR", sans-serif; cursor: pointer; display: grid; justify-items: center; gap: 1px; }
  .bs-rail button b { font-size: 16px; }
  .bs-sec { margin-top: 8px; }
  .bs-head { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; border-radius: 6px; background: #2a2e3e; color: #e8ebf5; font-weight: 700; cursor: pointer; }
  .bs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .bs-grid.shut { display: none; }
  .slot { position: relative; aspect-ratio: 1; border-radius: 8px; background: #1b1e2a; border: 1px solid #2c3042; padding: 0; cursor: pointer; overflow: hidden; }
  .slot canvas { width: 100%; height: 100%; display: block; }
  .slot.g0 { background: linear-gradient(145deg, #5a5d6a, #2e3038); border-color: #777b8c; }
  .slot.g1 { background: linear-gradient(145deg, #2f6aa8, #17304e); border-color: #5aa0e6; }
  .slot.g2 { background: linear-gradient(145deg, #7b3cc0, #3a1a5e); border-color: #b47cf0; }
  .slot.g3 { background: linear-gradient(145deg, #d99a1a, #6e4a08); border-color: #ffd36a; }
  .slot.sel { outline: 2px solid #fff; }
  .slot .eq { position: absolute; top: 2px; right: 2px; padding: 0 4px; border-radius: 3px; background: #e8762a; color: #fff; font: 800 10px sans-serif; }
  .slot .pl { position: absolute; left: 3px; bottom: 2px; color: #fff; font: 800 12px "Noto Sans KR", sans-serif; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  .slot .ct { position: absolute; right: 4px; bottom: 2px; color: #fff; font: 800 12px "Noto Sans KR", sans-serif; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  .bs-info { border-top: 1px solid #3a3f55; padding: 8px 12px; display: flex; gap: 10px; align-items: center; min-height: 58px; }
  .bs-info .nm { font-weight: 800; font-size: 14px; }
  .bs-info small { color: #a9afc4; }
  .eqv { padding-top: 8px; }
  .eqv-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; }
  .eqv-name { font-size: 16px; font-weight: 800; color: #fff; }
  .eqv-guild { color: #7fe39a; font-weight: 700; }
  .eqv-stat { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: #151722; border: 1px solid #2c3042; }
  .eqv-stat div:first-child { font-size: 20px; font-weight: 800; color: #ffb86a; }
  .eqv-stat small { color: #a9afc4; } .eqv-stat div:last-child { grid-column: 1 / -1; color: #c9cee0; margin-top: 2px; }
  .eqv-body { display: grid; grid-template-columns: 64px 1fr 136px; gap: 8px; align-items: center; margin-top: 10px; }
  .eqv-col { display: grid; gap: 8px; } .eqv-col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .eqv-mid { display: flex; justify-content: center; align-items: center; min-height: 190px; background: radial-gradient(circle at 50% 60%, rgba(255,255,255,.08), transparent 65%); }
  .eqv-empty, .eqv-lock { display: flex; align-items: center; justify-content: center; text-align: center; color: #6f7590; font-size: 11px; font-weight: 700; white-space: pre-line; border-style: dashed; cursor: default; }
  #notice { position: absolute; top: 0; left: 0; right: 0; z-index: 8; pointer-events: none; padding: 8px 14px; text-align: center; background: rgba(150,30,20,.92); color: #fff; font-weight: 800; font-size: 14px; }
  #notice[hidden] { display: none; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0c0708; font-size: 18px; text-align: center; padding: 20px; z-index: 9; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (max-height: 500px) { #panelIn { padding: 10px 14px; } .create { gap: 10px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="봉인검록 게임 화면"></canvas>
  <div class="pad" id="pad" hidden></div>
  <div id="hud" hidden><span class="who"><span id="hudName"></span> · <span id="hudGold"></span></span><button class="btn tiny danger" id="hudOp" type="button" hidden>운영</button><button class="btn tiny" id="hudBag" type="button">가방</button><button class="btn tiny ghost" id="hudKeys" type="button">키 설정</button><button class="btn tiny ghost" id="hudOut" type="button">캐릭터</button></div>
  <div id="partyBox" hidden></div>
  <div id="bagSide" hidden></div>
  <div id="chat"><div id="chatLog"></div><input id="chatIn" maxlength="80" placeholder="채팅 (Enter)" autocomplete="off"></div>
  <div id="notice" hidden></div>
  <div id="asks"></div>
  <div class="toast" id="toast"></div>
  <div id="panel" hidden><div id="panelIn"></div></div>
</div>
<div id="rotate">휴대폰을 가로로 돌려 주세요</div>
<script src="frames.js?v=202610270718"></script>
<script src="keys.js?v=202610270718"></script>
<script src="look.js?v=202610270718"></script>
<script src="game.js?v=202610270718"></script>
<script src="app.js?v=202610270718"></script>
</body>
</html>

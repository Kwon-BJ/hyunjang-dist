  @keyframes cardFlip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }

  .card.pick small { color: #5a2a0a; font-weight: 800; }
  .card.pick { background: linear-gradient(160deg, #f6d27a, #b8893a); color: #2a1808; border-color: #fff; cursor: default; transform: scale(1.05); }

</style>
